##############################################################################
# loja_sur.cfg  —  Configuración MintPy v1.6.2 — Órbita Sur (Track 142)
# Período: 2022-03-31 → 2026-03-10 | 216 adquisiciones | 389 interferogramas
# Autores: Adan Saúl Abarca-Abarca & Byron Antonio Bravo-Granda — USGP
##############################################################################

mintpy.load.processor    = hyp3

mintpy.load.unwFile      = AQUI_TU_RUTA_BASE/INTERFEROMETRIA_LOJA/ARTICULO/PROCESO_SUR/*/*.unw.tif
mintpy.load.corFile      = AQUI_TU_RUTA_BASE/INTERFEROMETRIA_LOJA/ARTICULO/PROCESO_SUR/*/*.cor.tif
mintpy.load.connCompFile = AQUI_TU_RUTA_BASE/INTERFEROMETRIA_LOJA/ARTICULO/PROCESO_SUR/*/*.unw_conncomp.tif
mintpy.load.demFile      = AQUI_TU_RUTA_BASE/INTERFEROMETRIA_LOJA/ARTICULO/PROCESO_SUR/*/*.dem.tif
mintpy.load.incAngleFile = AQUI_TU_RUTA_BASE/INTERFEROMETRIA_LOJA/ARTICULO/PROCESO_SUR/*/*.lv_theta.tif

mintpy.network.maxTempBaseline = 120
mintpy.network.maxPerpBaseline = 500
mintpy.network.minCoherence    = 0.4

# Seleccionar pixel en zona de solapamiento con Track 116
# (Y = 9,542,940 — 9,552,360 m UTM17S) para facilitar cálculo de offset
mintpy.reference.yx   = # REEMPLAZA CON TU Y/X
mintpy.reference.lalo = # REEMPLAZA CON TU LAT/LON

mintpy.networkInversion.weightFunc = no
mintpy.networkInversion.minTempCoh = 0.2

mintpy.troposphericDelay.method       = pyaps
mintpy.troposphericDelay.weatherModel = ERA5
mintpy.troposphericDelay.weatherDir   = AQUI_TU_RUTA_BASE/INTERFEROMETRIA_LOJA/ARTICULO/PROCESO_SUR/WEATHER_DIR

mintpy.topographicResidual = yes
mintpy.deramp              = no
mintpy.save.hdfEos5        = no

# NOTA OFFSET: Al fusionar Norte + Sur, el offset verificado del estudio es
# −30.72 mm/año (mediana Norte en solap: −19.76 | Sur en solap: +10.96).
# RECALCULA este offset con tus propios datos antes de aplicarlo.
