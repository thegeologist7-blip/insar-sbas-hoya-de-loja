##############################################################################
# loja_sbas.cfg  —  Configuración MintPy v1.6.2
# TFM: "Zonificación de deformaciones superficiales mediante análisis
#        InSAR-SBAS (2019–2026) en la Hoya de Loja"
# Autores: Adan Saúl Abarca-Abarca & Byron Antonio Bravo-Granda — USGP
#
# INSTRUCCIONES:
#   1. Reemplaza AQUI_TU_RUTA_BASE con tu ruta real (p.ej. C:/VARIOS)
#      Busca con Ctrl+F para encontrar todos los marcadores.
#   2. Coloca este archivo en la carpeta PROCESO_OK (no en inputs/).
#   3. Ejecuta desde Anaconda Prompt:
#        smallbaselineApp.py loja_sbas.cfg
##############################################################################

########## 1. DATOS DE ENTRADA ###############################################

mintpy.load.processor   = hyp3

mintpy.load.unwFile     = AQUI_TU_RUTA_BASE/INTERFEROMETRIA_LOJA/ARTICULO/PROCESO_OK/*/*.unw.tif
mintpy.load.corFile     = AQUI_TU_RUTA_BASE/INTERFEROMETRIA_LOJA/ARTICULO/PROCESO_OK/*/*.cor.tif
mintpy.load.connCompFile= AQUI_TU_RUTA_BASE/INTERFEROMETRIA_LOJA/ARTICULO/PROCESO_OK/*/*.unw_conncomp.tif
mintpy.load.demFile     = AQUI_TU_RUTA_BASE/INTERFEROMETRIA_LOJA/ARTICULO/PROCESO_OK/*/*.dem.tif
mintpy.load.incAngleFile= AQUI_TU_RUTA_BASE/INTERFEROMETRIA_LOJA/ARTICULO/PROCESO_OK/*/*.lv_theta.tif

########## 2. RED INTERFEROMÉTRICA ###########################################

mintpy.network.maxTempBaseline = 120
mintpy.network.maxPerpBaseline = 500
mintpy.network.minCoherence    = 0.4

########## 3. PUNTO DE REFERENCIA ############################################
# Pixel de referencia del estudio: y=434, x=180
# UTM 17S: 699,160 E / 9,556,800 N | coherencia temporal = 0.96
# REEMPLAZA con las coordenadas que obtengas en tu procesamiento:

mintpy.reference.yx   = 434 180
mintpy.reference.lalo = -3.985 -79.200

########## 4. INVERSIÓN SBAS #################################################

# weightFunc = no  →  OBLIGATORIO para datos HyP3 geocodificado
mintpy.networkInversion.weightFunc = no
mintpy.networkInversion.minTempCoh = 0.2

########## 5. CORRECCIÓN TROPOSFÉRICA ERA5 ###################################

mintpy.troposphericDelay.method       = pyaps
mintpy.troposphericDelay.weatherModel = ERA5
mintpy.troposphericDelay.weatherDir   = AQUI_TU_RUTA_BASE/INTERFEROMETRIA_LOJA/ARTICULO/PROCESO_OK/WEATHER_DIR

########## 6. CORRECCIÓN DE ERROR DEM #######################################

mintpy.topographicResidual = yes

########## 7. RAMPA ##########################################################

# 'no' = conserva la señal de deformación real
mintpy.deramp = no

########## 8. SALIDA #########################################################

mintpy.save.hdfEos5 = no

##############################################################################
# NOTAS CRÍTICAS:
#
# ▸ dropIfgram en MintPy v1.6.2: True = ACTIVO (lógica INVERTIDA respecto
#   a documentación oficial).
#
# ▸ weightFunc = 'no' es OBLIGATORIO para HyP3. Con 'var' colapsa la
#   coherencia en datos geocodificados.
#
# ▸ UNIT en ifgramStack.h5 debe ser 'radian'. Verifica con:
#     python -c "import h5py; f=h5py.File('inputs/ifgramStack.h5'); print(f['unwrapPhase'].attrs['UNIT'])"
#
# ▸ Si aparece error "unknown satellite S1C", edita manualmente
#   prep_hyp3.py y agrega 'S1C' a la lista de satélites reconocidos.
#
# ▸ URL ECMWF CDS correcta (post-2024):
#     https://cds.climate.copernicus.eu/api   (sin /v2)
#   Configura en ~/.cdsapirc
##############################################################################
